; Faketec RA-01: Faketec (ProMicro nRF52840) + Ai-Thinker Ra-01 (SX1278, 410-525 MHz, max +18 dBm, crystal)
; + optional AHT20/BMP280/BME280/INA219/INA226/INA3221 + RTC + GPS.
; Board sources are shared with variants/promicro. Radio defaults as FakeSolar (433 MHz).
; Wiring: DIO0 -> P0.29 (BUSY pad, extra wire), DIO1 -> P0.10 (DIO1/IRQ pad); same as Meshtastic RF95 on this board.
; SX1278 is driven by the SX1276 class (same registers). SX126x-only patches do not apply.
; TX power capped at 18 dBm (LORA_TX_POWER_MAX): higher 'set tx' is rejected, saved values are clipped.
; Battery: ADC divider 1 MOhm (B+) / 1.5 MOhm (B-): 1.465; change with 'set adc.multiplier <x>'.

[Faketec_RA01]
extends = Promicro
build_unflags =
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
build_flags = ${Promicro.build_flags}
  -D USE_SX1276
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D LORA_TX_POWER=18
  -D LORA_TX_POWER_MAX=18
  -D SX127X_CURRENT_LIMIT=140
  -D LORA_FREQ=433.650
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=8
  -D GPS_BAUD_AUTODETECT
  -D GPS_DUTY_CYCLE
  -D GPS_CYCLE_MIN=30
  -D GPS_ONTIME_SEC=300
  -D GPS_GUARD
  -D GPS_GUARD_LAT_MIN=44.0
  -D GPS_GUARD_LAT_MAX=52.5
  -D GPS_GUARD_LON_MIN=22.0
  -D GPS_GUARD_LON_MAX=40.3
  -D ADC_MULTIPLIER=1.465f
  -D BATT_ADC_SAMPLE_TIME_US=40

[env:Faketec_RA01_repeater]
extends = Faketec_RA01
build_src_filter = ${Promicro.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
build_flags = ${Faketec_RA01.build_flags}
  -D ADVERT_NAME='"Faketec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D DISPLAY_CLASS=SSD1306Display
lib_deps = ${Promicro.lib_deps}
  adafruit/RTClib @ ^2.1.3

[env:Faketec_RA01_sensor]
extends = Faketec_RA01
build_src_filter = ${Promicro.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_sensor>
build_flags = ${Faketec_RA01.build_flags}
  -D ADVERT_NAME='"Faketec Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D DISPLAY_CLASS=SSD1306Display
lib_deps = ${Promicro.lib_deps}
  adafruit/RTClib @ ^2.1.3

[env:Faketec_RA01_companion_radio_ble]
extends = Faketec_RA01
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${Faketec_RA01.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=SSD1306Display
build_src_filter = ${Promicro.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Promicro.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0

[env:Faketec_RA01_repeater_debug]
extends = env:Faketec_RA01_repeater
build_flags = ${env:Faketec_RA01_repeater.build_flags}
  -D MESH_DEBUG=1
